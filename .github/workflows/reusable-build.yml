name: OpenWrt Build Package

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      sdk_packages:
        required: true
        type: string
      artifacts_patterns:
        required: true
        type: string
      openwrt_version:
        required: true
        type: string
      openwrt_build_version:
        required: true
        type: string
      arch:
        required: true
        type: string
      target:
        required: false
        type: string
      selected_version:
        required: false
        type: string
        default: 'all'
      free_disk_space:
        required: false
        type: boolean
        default: false
      create_swap:
        required: false
        type: boolean
        default: false
      verbose:
        required: false
        type: boolean
        default: false
      apk_key:
        required: false
        type: string
      ipk_key:
        required: false
        type: string
    secrets:
      USIGN_SECRET:
        required: false
      APK_SIGN_KEY:
        required: false
    outputs:
      tag_name:
        value: ${{ jobs.build.outputs.tag_name }}

jobs:
  build:
    name: Build ${{ inputs.openwrt_version }} - ${{ inputs.arch }}
    runs-on: ubuntu-24.04
    if: |
      inputs.selected_version == 'all' ||
      inputs.selected_version == inputs.openwrt_version
    outputs:
      tag_name: ${{ steps.version_logic.outputs.version_tag }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          path: ${{ github.workspace }}/feed/${{ inputs.package_name }}
          fetch-depth: 0

      - name: Get Version from Tag
        id: get_tag_version
        if: startsWith(github.ref, 'refs/tags/')
        uses: ChrSchu90/GitTagSemanticVersion@v1.1
        continue-on-error: true

      - name: Get Version from Makefile (Fallback)
        id: get_makefile_version
        if: always() && steps.get_tag_version.outcome != 'success'
        run: |
          MAKEFILE_PATH="${{ github.workspace }}/feed/${{ inputs.package_name }}/Makefile"
          if [ -f "$MAKEFILE_PATH" ]; then
            VERSION=$(grep "PKG_VERSION:=" "$MAKEFILE_PATH" | cut -d'=' -f2 | tr -d ' "')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Finalize Version String
        id: version_logic
        run: |
          if [ "${{ steps.get_tag_version.outcome }}" == "success" ]; then
            FINAL_VER="${{ steps.get_tag_version.outputs.version }}"
          elif [ "${{ steps.get_makefile_version.outputs.found }}" == "true" ]; then
            FINAL_VER="${{ steps.get_makefile_version.outputs.version }}-test"
          else
            FINAL_VER="0.0.0-unknown"
          fi
          echo "version=$FINAL_VER" >> $GITHUB_OUTPUT
          echo "version_tag=v$FINAL_VER" >> $GITHUB_OUTPUT

      - name: Free Disk Space
        if: ${{ inputs.free_disk_space }}
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false

      - name: Create Swap Space
        if: ${{ inputs.create_swap }}
        uses: actionhippie/swap-space@v1
        with:
          size: 10G

      - name: Initialize SDK Directories
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          mkdir -p ${{ github.workspace }}/feed

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        if: always() && inputs.target != ''
        env:
          ARCH: ${{ inputs.arch }}-${{ inputs.openwrt_build_version }}
          PACKAGES: ${{ inputs.sdk_packages }}
          V: ${{ inputs.verbose && 'sc' || '0' }}
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          KEY_BUILD: ${{ secrets.USIGN_SECRET }}
          PRIVATE_KEY: ${{ secrets.APK_SIGN_KEY }}

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        if: always() && inputs.target == ''
        env:
          ARCH: ${{ inputs.arch }}-${{ inputs.openwrt_build_version }}
          PACKAGES: ${{ inputs.sdk_packages }}
          V: ${{ inputs.verbose && 'sc' || '0' }}
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          KEY_BUILD: ${{ secrets.USIGN_SECRET }}
          PRIVATE_KEY: ${{ secrets.APK_SIGN_KEY }}

      - name: Install apk-tools
        run: |
          sudo wget -qO /usr/local/bin/apk \
            https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v3.0.6/x86_64/apk.static
          sudo chmod +x /usr/local/bin/apk
          apk --version

      - name: Collect and Filter Artifacts
        id: collect
        run: |
          mkdir -p ${{ github.workspace }}/filtered-assets
          
          MAIN_TARGET=$(echo "${{ inputs.arch }}" | cut -d'-' -f1)

          echo "${{ inputs.artifacts_patterns }}" | while read -r pattern; do
            [ -z "$pattern" ] && continue
            echo "🔍 Searching for: $pattern"

            find ${{ github.workspace }}/artifacts/bin/ -name "$pattern" -type f | while read -r src; do
              FILENAME=$(basename "$src")

              EXT="${FILENAME##*.}"
              BASE="${FILENAME%.*}"

              if [[ "$EXT" == "apk" ]]; then
                # 25.12+: arch is NOT in filename. Read all metadata from one adbdump call.
                ADB_DUMP=$(apk adbdump "$src")
                PKG_NAME=$(echo "$ADB_DUMP" | awk -F': *' '/^[[:space:]]*name[[:space:]]*:/{print $2; exit}' | tr -d '[:space:]')
                PKG_VERSION=$(echo "$ADB_DUMP" | awk -F': *' '/^[[:space:]]*version[[:space:]]*:/{print $2; exit}' | tr -d '[:space:]')
                PKG_ARCH=$(echo "$ADB_DUMP" | awk -F': *' '/^[[:space:]]*arch[[:space:]]*:/{print $2; exit}' | tr -d '[:space:]')
                echo "🔎 apk metadata: name='$PKG_NAME' version='$PKG_VERSION' arch='$PKG_ARCH' (file: $FILENAME)"

                if [[ "$PKG_ARCH" == "noarch" || -z "$PKG_ARCH" ]]; then
                  ARCH_INFO="all"
                else
                  ARCH_INFO="$PKG_ARCH"
                fi

                if [[ "$FILENAME" == kmod-* ]]; then
                  # Kmod metadata version embeds kernel version as 3 leading
                  # dotted parts (e.g. 6.12.71.1.4.1-r1). Strip them.
                  CLEAN_VERSION=$(echo "$PKG_VERSION" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+\.//')
                  if [[ "$src" =~ "/targets/" ]]; then
                    T_INFO=$(echo "$src" | awk -F'/targets/' '{print $2}' | cut -d'/' -f1,2 | tr '/' '_')
                    NEW_NAME="${PKG_NAME}_${CLEAN_VERSION}_${T_INFO}_${ARCH_INFO}_${{ inputs.openwrt_build_version }}.${EXT}"
                  else
                    NEW_NAME="${PKG_NAME}_${CLEAN_VERSION}_${ARCH_INFO}_${{ inputs.openwrt_build_version }}.${EXT}"
                  fi
                else
                  NEW_NAME="${BASE}_${ARCH_INFO}_${{ inputs.openwrt_version }}.${EXT}"
                fi
              else
                # .ipk (24.10 and earlier).
                if [[ "$src" =~ "/targets/" ]]; then
                  T_INFO=$(echo "$src" | awk -F'/targets/' '{print $2}' | cut -d'/' -f1,2 | tr '/' '_')
                  if [[ "$FILENAME" == kmod-* ]]; then
                    # Strip kernel version (3 leading dotted parts) if present
                    # and insert T_INFO after the package version.
                    CLEAN_BASE=$(echo "$BASE" | sed -E "s/_([0-9]+\.[0-9]+\.[0-9]+\.)?([0-9]+(\.[0-9]+)*-r[0-9]+)_/_\2_${T_INFO}_/")
                    NEW_NAME="${CLEAN_BASE}_${{ inputs.openwrt_build_version }}.${EXT}"
                  else
                    NEW_NAME="${BASE}_${T_INFO}_${{ inputs.openwrt_version }}.${EXT}"
                  fi
                else
                  NEW_NAME="${BASE}_${{ inputs.openwrt_version }}.${EXT}"
                fi
              fi

              echo "📦 Copying: $FILENAME"
              echo "➡️ Destination: $NEW_NAME"
              cp -v "$src" "${{ github.workspace }}/filtered-assets/$NEW_NAME"
            done
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.package_name }}-${{ steps.version_logic.outputs.version }}-${{ inputs.openwrt_build_version }}-${{ inputs.arch }}
          path: |
            ${{ github.workspace }}/filtered-assets/*.ipk
            ${{ github.workspace }}/filtered-assets/*.apk
          retention-days: 7
          overwrite: true
